<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="architecture-title architecture-desc" id="architecture-root">
<title id="architecture-title">Gateway and execution</title>
<desc id="architecture-desc">Web panel and API requests pass access checks. Scheduled prompts enter the dispatcher, backed by SQLite. Account selection and failover support CLI sessions, which call model providers and work in project folders.</desc>
<defs>
      <style>#architecture-root { color-scheme: dark;
      --bg: #0C0D0F; --surface: #121417; --surface-2: #181B1F;
      --fg: #E6E8EB; --muted: #8B929C; --border: #23272D; --border-strong: #323840;
      --accent: #FF6A2B; --accent-text: #FF7A40; --accent-soft: rgba(255,106,43,.12);
      --font-sans: 'Geist', Arial, sans-serif;
      --font-mono: 'Geist Mono', Consolas, monospace; }
      #architecture-root { color: var(--fg); font-family: var(--font-sans); }
      #architecture-root figure { margin: 32px 0 24px; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); overflow: hidden; }
      #architecture-root figcaption { padding: 16px 24px; border-bottom: 1px solid var(--border); font-size: 14px; color: var(--muted); }
      #architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #architecture-root .dg-arrow { fill: none; stroke: var(--muted); stroke-width: 1.2; }
      #architecture-root .dg-head { fill: var(--muted); }
      #architecture-root .dg-mask { fill: var(--surface); }
      #architecture-root .dg-label, #architecture-root .dg-tag-text, #architecture-root .dg-sub, #architecture-root .dg-legend-title { font-family: var(--font-mono); }
      #architecture-root .dg-label { fill: var(--muted); font-size: 8px; letter-spacing: .08em; text-anchor: middle; }
      #architecture-root .dg-box { stroke-width: 1; }
      #architecture-root .is-backend .dg-box { fill: var(--surface); stroke: var(--fg); stroke-opacity: .6; }
      #architecture-root .is-store .dg-box { fill: var(--surface-2); stroke: var(--muted); }
      #architecture-root .is-input .dg-box { fill: var(--surface); stroke: var(--border-strong); }
      #architecture-root .is-external .dg-box { fill: var(--surface); stroke: var(--border-strong); stroke-dasharray: 4 3; }
      #architecture-root .is-focal .dg-box { fill: var(--accent-soft); stroke: var(--accent); }
      #architecture-root .dg-tag { fill: none; stroke: var(--muted); stroke-opacity: .5; stroke-width: .8; }
      #architecture-root .is-focal .dg-tag { stroke: var(--accent); }
      #architecture-root .dg-tag-text { fill: var(--muted); font-size: 7px; letter-spacing: .08em; text-anchor: middle; }
      #architecture-root .is-focal .dg-tag-text { fill: var(--accent-text); }
      #architecture-root .dg-name { fill: var(--fg); font-family: var(--font-sans); font-size: 15px; font-weight: 600; text-anchor: middle; }
      #architecture-root .dg-sub { fill: var(--muted); font-size: 11px; text-anchor: middle; }
      #architecture-root .dg-callout { fill: var(--muted); font-family: var(--font-sans); font-size: 12px; font-weight: 500; }
      #architecture-root .dg-rule { stroke: var(--border); stroke-width: .8; }
      #architecture-root .dg-legend-title { fill: var(--muted); font-size: 8px; letter-spacing: .18em; }
      #architecture-root .dg-legend { fill: var(--muted); font-family: var(--font-sans); font-size: 9px; }
      #architecture-root figcaption { padding: 16px; }
      #architecture-root figure { overflow: visible; break-inside: avoid; }
      #architecture-root .diagram-container { overflow: visible; }
      #architecture-root nav { margin: 20px 0; font-size: 14px; }
      #architecture-root a { color: var(--accent-text); }
      #architecture-root .dg-note { fill: var(--muted); font: 12px Arial, sans-serif; }</style>
<marker id="architecture-dg-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#8B929C"/>
</marker>
<marker id="architecture-dg-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#FF6A2B"/>
</marker>
<marker id="architecture-dg-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#8B929C"/>
</marker>
</defs>
<rect width="960" height="600" fill="#121417"/>
