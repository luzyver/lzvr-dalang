upstream lzvr_dalang {
    server 127.0.0.1:9876;
    keepalive 16;
}

# Who may reach the panel and API. Anyone not listed gets 403. Replace the example addresses (documentation ranges that
# match nobody real) with yours: until you do, only this machine can get in. IPv6 and CIDR ranges work too.
geo $lzvr_allowed {
    default          0;
    127.0.0.1        1;   # this machine
    203.0.113.10     1;   # EXAMPLE: replace with your office/home address
    198.51.100.0/24  1;   # EXAMPLE: replace with a range, or delete the line
    # 2001:db8::/32  1;
}

# An extra brake on the sign-in endpoints. Dalang already blocks 10 wrong tokens per minute per address;
# this stops floods before they reach it. 30/min with a burst of 20 leaves room for normal sign-ins.
limit_req_zone $binary_remote_addr zone=lzvr_login:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    server_tokens off;
    client_max_body_size 60m;      # Dalang caps uploads at 50 MB

    # Shared by every location below (nginx only inherits these when a location sets none of its own).
    # certbot copies this whole block into the https server, so these carry over.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";                 # keep the upstream connection open
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;       # replaces, never appends: clients cannot forge it
    proxy_set_header X-Forwarded-Proto $scheme;

    # Live events are Server-Sent Events: they must not be buffered, and may stay open for hours.
    proxy_buffering       off;
    proxy_cache           off;
    proxy_read_timeout    24h;
    proxy_send_timeout    5m;
    proxy_connect_timeout 5s;

    # The IP check lives inside these two locations, not at server level, on purpose: certbot answers Let's Encrypt's
    # challenge from its own temporary location, and that must stay reachable from any address.
    location /api/auth/ {
        if ($lzvr_allowed = 0) { return 403; }
        limit_req zone=lzvr_login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://lzvr_dalang;
    }

    # The code editor's terminals are WebSockets: nginx only passes the upgrade on when told to. (A location that sets a
    # header of its own inherits none of the ones above, hence the full list.)
    location = /api/terminals/socket {
        if ($lzvr_allowed = 0) { return 403; }
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://lzvr_dalang;
    }

    location / {
        if ($lzvr_allowed = 0) { return 403; }
        proxy_pass http://lzvr_dalang;
    }
}
