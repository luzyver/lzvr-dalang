upstream lzvr_dalang {
    server 127.0.0.1:9876;
    keepalive 16;
}

# An extra brake on the sign-in endpoints. Dalang already blocks 10 wrong tokens per minute per address;
# this stops floods before they reach it. 30/min with a burst of 20 leaves room for normal passkey logins.
limit_req_zone $binary_remote_addr zone=lzvr_login:10m rate=30r/m;

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    server_tokens off;
    client_max_body_size 60m;      # Dalang caps uploads at 50 MB

    # Shared by every location below (nginx only inherits these when a location sets none of its own).
    # certbot copies this whole block into the https server, so these carry over.
    proxy_http_version 1.1;
    proxy_set_header Connection        "";                 # keep the upstream connection open
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;       # replaces, never appends: clients cannot forge it
    proxy_set_header X-Forwarded-Proto $scheme;

    # Live events are Server-Sent Events: they must not be buffered, and may stay open for hours.
    proxy_buffering       off;
    proxy_cache           off;
    proxy_read_timeout    24h;
    proxy_send_timeout    5m;
    proxy_connect_timeout 5s;

    location /api/auth/ {
        limit_req zone=lzvr_login burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://lzvr_dalang;
    }

    location / {
        proxy_pass http://lzvr_dalang;
    }
}
